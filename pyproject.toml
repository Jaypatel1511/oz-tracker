[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "oz-tracker"
version = "0.2.0"
description = "Opportunity Zone tracker — QOF tax-benefit and portfolio modeling. NOTE: OZ tract lookup is NON-FUNCTIONAL in 0.2.0; both upstream data sources return 404, and this version raises a typed error rather than returning fabricated results. See README."
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "Jay Patel", email = "thejaypatel1511@gmail.com"}]
dependencies = [
    "pandas>=1.4.0",
    "numpy>=1.21.0",
    "requests>=2.27.0",
    "openpyxl>=3.0.0",
]

# Development Status is "3 - Alpha" deliberately, and it is the honest rung.
# Not "5 - Production/Stable": the headline feature (tract lookup) is
# non-functional, both upstream URLs are 404, and 0.2.0 is a breaking change.
# Not "7 - Inactive" (which sbic-tracker correctly uses): oz-tracker is
# maintained and restoration is planned — see the README Status section, which
# separates the OZ 1.0 vintage blocker from the OZ 2.0 scope deferral.
# "3 - Alpha" is what a browser of PyPI needs to see: usable in parts, not to
# be relied on whole.
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Financial and Insurance Industry",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial :: Investment",
    "Topic :: Scientific/Engineering :: Information Analysis",
]

[project.urls]
Homepage = "https://github.com/Jaypatel1511/oz-tracker"

[tool.pytest.ini_options]
# --import-mode=importlib is required, not cosmetic. Under the default "prepend"
# mode pytest puts the rootdir on sys.path, so `import oztracker` resolves to
# ./oztracker even when a built wheel is the thing under test — CI would report
# green for the wheel while actually exercising the source tree. The release
# workflow also passes this flag explicitly, because the wheel-test job runs the
# suite from a copied directory that does not contain this file.
addopts = "--import-mode=importlib"
testpaths = ["tests"]
